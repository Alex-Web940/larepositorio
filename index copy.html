<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.18.1/axios.js"></script>
    <link rel="stylesheet" href="tarjeta.cs">
    <title>tarjeta</title>
</head>
<body>
    <div class="credencial">

        <header>
            <h1>CREDENCIAL</h1>
        </header>

        <div class="credencial-info">

        <img class="img-credencial" alt="">

        <div class="credencial-presentacion">
        <h2 id="nombre"></h2>
        <h2 id="apellido"></h2>
        </div>

        <hr>

        <div class="credencial-text">

        <p>Título</p>
        <p id="titulo" class="dato"></p>

        <p>Género</p>
        <p id="genero" class="dato"></p>

        <p>Edad</p>
        <p id="edad" class="dato"></p>

        <p>Fecha Nacimienta</p>
        <p id="fecha-na" class="dato"></p>

        <p>Email</p>
        <p id="email" class="dato"></p>

        <p>celular</p>
        <p id="celular" class="dato"></p>

        <p>Teléfono</p>
        <p id="telefono" class="dato"></p>

        <p>Nacionalidad</p>
        <p id="nacionalidad" class="dato"></p>

        <p>país</p>
        <p id="pais" class="dato"></p>

        <p>Estado</p>
        <p id="estado" class="dato"></p>

        <p>City</p>
        <p id="cuidad" class="dato"></p>

        <p>calle</p>
        <p id="calle" class="dato"></p>

        <p>Número de calle</p>
        <p id="num_calle" class="dato"></p>

        <p>Código postal</p>
        <p id="codigo_postal" class="dato"></p>

        </div>
        </div>
    </div>
    

    <script>
        document.addEventListener("DOMContentLoaded", async()=>{
            let res = await axios.get("https://randomuser.me/api/")
            console.log(res);
            let nombre = document.getElementById("nombre")
            nombre.textContent = res.data.results[0].name.first

            let apellido = document.getElementById("apellido")
            apellido.textContent = res.data.results[0].name.last
            
            let perfil = document.querySelector(".img-credencial")
            perfil.src = res.data.results[0].picture.large

            let telefono = document.getElementById("telefono")
            telefono.textContent = res.data.results[0].phone

            let edad = document.getElementById("edad")
            edad.textContent = res.data.results[0].dob.age


            let email = document.getElementById("email")
            email.textContent = res.data.results[0].email

            let pais = document.getElementById("pais")
            pais.textContent = res.data.results[0].location.country

            let ciudad = document.getElementById("cuidad")
            ciudad.textContent = res.data.results[0].location.city

            
            let fecha = document.getElementById("fecha-na");
            let fechaApi = new Date(res.data.results[0].dob.date)
            fecha.textContent = fechaApi.toLocaleDateString("es-CO")

            let genero = document.getElementById("genero")
            genero.textContent = res.data.results[0].gender

            let Titulo = document.getElementById("titulo")
            Titulo.textContent = res.data.results[0].name.title

            let celular = document.getElementById("celular")
            celular.textContent = res.data.results[0].cell

            let Estado = document.getElementById("estado")
            Estado.textContent = res.data.results[0].location.state

            let num_calle = document.getElementById("num_calle")
            num_calle.textContent = res.data.results[0].location.street.number

            let calle = document.getElementById("calle")
            calle.textContent = res.data.results[0].location.street.name

            let codigo_postal = document.getElementById("codigo_postal")
            codigo_postal.textContent = res.data.results[0].location.postcode

            let nacionalidad = document.getElementById("nacionalidad")
            nacionalidad.textContent = res.data.results[0].nat
        }) 

        document.querySelectorAll(".dato").forEach(element => {
            element.addEventListener("click", () => {
                window.open(
                    ` https://www.google.com/search?q=${encodeURIComponent(element.textContent)}`,
                    "_blank"
            
                );
            });
        });
    </script>
</body>
</html>
